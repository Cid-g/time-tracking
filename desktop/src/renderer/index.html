<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>WorkPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Custom Title Bar -->
  <div id="titlebar">
    <div class="titlebar-left">
      <span class="titlebar-logo">W</span>
      <span class="titlebar-text">WorkPulse</span>
    </div>
    <div class="titlebar-controls">
      <button id="btn-minimize" class="titlebar-btn" title="Minimize to tray">
        <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button id="btn-close" class="titlebar-btn close" title="Close">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <!-- Login View -->
  <div id="login-view" class="view active">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <div class="logo-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <h1>WorkPulse</h1>
          <p>Desktop Agent</p>
        </div>
      </div>

      <form id="login-form">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <div id="error-msg" class="error-msg hidden"></div>
        <button type="submit" id="btn-login" class="btn-login">
          <span id="btn-login-text">Sign In</span>
          <span id="btn-login-loading" class="hidden">Signing in...</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view" class="view">
    <div class="dashboard">
      <!-- User Profile Section -->
      <div class="profile-section">
        <div class="profile-left">
          <div class="profile-avatar" id="user-avatar">U</div>
          <div class="profile-info">
            <h2 id="user-name">User</h2>
            <span class="profile-role" id="user-role">Member</span>
          </div>
        </div>
        <button id="btn-logout" class="btn-logout" title="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- Active Timer Bar (WebWork-style colored header) -->
      <div id="timer-bar" class="timer-bar idle">
        <div class="timer-bar-content">
          <div class="timer-bar-left">
            <div class="timer-bar-status" id="timer-bar-status">
              <span class="status-dot"></span>
              <span id="timer-status-text">No active timer</span>
            </div>
            <div class="timer-bar-meta" id="timer-bar-meta"></div>
          </div>
          <div class="timer-bar-right">
            <span class="timer-clock" id="timer-display">00:00:00</span>
          </div>
        </div>
      </div>

      <!-- Task Inputs (shown when no timer) -->
      <div id="task-inputs" class="task-inputs">
        <div class="task-input-group">
          <label>What are you working on?</label>
          <input type="text" id="description" placeholder="Enter task description..." maxlength="500">
        </div>

        <div class="selectors-row">
          <!-- Project dropdown -->
          <div class="selector" id="project-dropdown">
            <button type="button" class="selector-trigger" id="project-trigger">
              <span class="selector-dot" id="project-dot"></span>
              <span class="selector-label" id="project-label">Select Project</span>
              <svg class="selector-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="selector-menu hidden" id="project-menu"></div>
          </div>

          <!-- Task dropdown -->
          <div class="selector" id="task-dropdown">
            <button type="button" class="selector-trigger" id="task-trigger" disabled>
              <span class="selector-dot task-dot" id="task-dot"></span>
              <span class="selector-label" id="task-label">Select Task</span>
              <svg class="selector-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <div class="selector-menu hidden" id="task-menu"></div>
          </div>
        </div>
      </div>

      <!-- Active Entry Info (shown when timer running) -->
      <div id="active-info" class="active-info hidden">
        <div class="active-description" id="active-description"></div>
        <div class="active-meta" id="active-meta"></div>
      </div>

      <!-- Timer Controls -->
      <div class="timer-controls">
        <button id="btn-start" class="btn-control btn-start">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Start Timer
        </button>
        <button id="btn-pause" class="btn-control btn-pause hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          Pause
        </button>
        <button id="btn-resume" class="btn-control btn-resume hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Resume
        </button>
        <button id="btn-stop" class="btn-control btn-stop hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          Stop
        </button>
      </div>

      <!-- Activity Monitor Section -->
      <div id="activity-section" class="activity-section">
        <div class="activity-header">
          <span class="activity-title">Activity Monitor</span>
          <span class="activity-status" id="activity-status">Idle</span>
        </div>
        <div class="activity-stats">
          <div class="stat-item">
            <span class="stat-label">Mouse</span>
            <div class="stat-bar"><div class="stat-fill mouse-fill" id="mouse-activity" style="width:0%"></div></div>
            <span class="stat-value" id="mouse-value">0%</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Keyboard</span>
            <div class="stat-bar"><div class="stat-fill keyboard-fill" id="keyboard-activity" style="width:0%"></div></div>
            <span class="stat-value" id="keyboard-value">0%</span>
          </div>
        </div>
        <div class="current-app" id="current-app">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span id="current-app-name">No app detected</span>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
